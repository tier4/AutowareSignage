sonar.projectKey=tier4_AutowareSignage
sonar.organization=tier4

# Source code
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Exclude test code from duplication check
sonar.cpd.exclusions=tests/**/*.py

# Python coverage report path (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml
