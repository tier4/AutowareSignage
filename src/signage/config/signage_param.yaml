signage:
  ros__parameters:
    signage_stand_alone: true
    ignore_emergency_stoppped: false
    ignore_disconnected: false
    ignore_manual_driving: false
    set_goal_by_distance: false
    freeze_emergency: true
    goal_distance: 1.0 # meter
    check_fms_time: 2.0 # second
    emergency_ignore_period: 5.0 # second
    emergency_repeat_period: 180.0 # second
    accept_start: 5.0 # second
    arriving_distance: 10.0 # m (UC-05 到着接近の車内安全配慮しきい値 SYS-HMI-07)
    monitor_width: 1920
    monitor_height: 540
    cvm_device_id: in_vehicle_signage
    announce:
      emergency: true
      restart_engage: true
      door_close: true
      door_open: true
      engage: true
      thank_you: true
      in_emergency: true
      going_to_depart: true
      going_to_arrive: false # 到着予告(もうすぐ到着)はPhase1方針でデフォルト除外(次バス停案内・停車時安全配慮と重複するため)
      arrive_caution: true # UC-05 接近10mの車内安全配慮アナウンス (SYS-HMI-07)
      arrived: true # UC-05 停止後の到着案内 (SYS-HMI-07)
      temporary_stop: true # UC-04 一時停止・横断歩道の車内案内 (SYS-HMI-04/05)
      obstacle_stop: true # UC-04 障害物停止の車内案内 (SYS-HMI-06)
    announce_interval: # 発話後にその期間だけ再発話を抑止する秒数 (表示時間も連動)
      stop_reason: 20.0 # second (UC-04 停止案内 SYS-HMI-04/05/06)
      arrived: 5.0 # second (UC-05 到着表示の表示秒数 SYS-HMI-07)
