signage:
  ros__parameters:
    signage_stand_alone: true
    ignore_emergency_stoppped: false
    ignore_disconnected: false
    ignore_manual_driving: false
    set_goal_by_distance: false
    freeze_emergency: true
    goal_distance: 1.0 # meter
    check_fms_time: 2.0 # second
    emergency_ignore_period: 5.0 # second
    emergency_repeat_period: 180.0 # second
    accept_start: 5.0 # second
    arriving_distance: 10.0 # m (UC-05 到着接近の車内安全配慮しきい値 SYS-HMI-07)
    monitor_width: 1920
    monitor_height: 540
    cvm_device_id: in_vehicle_signage
    standing_mode_default: false # 立席運用モードの起動時デフォルト (ファイルが優先)
    sudden_decel_threshold: 0.8 # m/s^2 (acceleration <= -本値 で急減速)
    sudden_decel_jerk_threshold: 0.6 # m/s^3 (jerk <= -本値 で急減速。減速方向のみ判定=加速時は対象外)
    sudden_lateral_accel_threshold: 0.8 # m/s^2 (lateral_acceleration_abs >= 本値 で急操舵)
    sudden_lateral_jerk_threshold: 0.5 # m/s^3 (|横ジャーク| >= 本値 で急操舵。横ジャーク≒v^2*steering_rate/wheel_base)
    wheel_base: 2.75 # m (横ジャーク計算用フォールバック。/api/vehicle/dimensions 取得成功で上書き)
    announce:
      emergency: true
      restart_engage: true
      door_close: true
      door_open: true
      engage: true
      thank_you: true
      in_emergency: true
      going_to_depart: true
      going_to_arrive: false # 到着予告(もうすぐ到着)はPhase1方針でデフォルト除外(次バス停案内・停車時安全配慮と重複するため)
      arrive_caution: true # UC-05 接近10mの車内安全配慮アナウンス (SYS-HMI-07)
      temporary_stop: false # UC-04 停止案内(障害物/横断歩道/一般 共通「停車します」) SYS-HMI-04/05/06。走行中の停止発話は不要との判断でデフォルトOFF (2026-07-30)
      standing_depart: true # UC-02 発車警告 SYS2-UC02-01
      standing_sudden: true # UC-03 急減速・急操舵警告 SYS2-UC03-06
    announce_interval: # 発話後にその期間だけ再発話を抑止する秒数 (表示時間も連動)
      stop_reason: 20.0 # second (UC-04 停止案内 SYS-HMI-04/05/06)
      arrived: 5.0 # second (UC-05 到着表示の表示秒数 SYS-HMI-07)
      standing_depart: 5.0 # second (UC-02 発車警告 SYS2-UC02-01)
      standing_sudden: 10.0 # second (UC-03 急減速・急操舵警告 SYS2-UC03-06)
