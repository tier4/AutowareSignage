signage:
  ros__parameters:
    signage_stand_alone: true
    ignore_emergency_stoppped: false
    ignore_disconnected: false
    ignore_manual_driving: false
    set_goal_by_distance: false
    freeze_emergency: true
    goal_distance: 1.0 # meter
    check_fms_time: 2.0 # second
    emergency_ignore_period: 5.0 # second
    emergency_repeat_period: 180.0 # second
    accept_start: 5.0 # second
    monitor_width: 1920
    monitor_height: 540
    cvm_device_id: in_vehicle_signage
    standing_mode_default: false # 立席運用モードの起動時デフォルト (ファイルが優先)
    standing_warning_cooldown: 10.0 # second
    sudden_decel_threshold: 0.8 # m/s^2 (acceleration <= -本値 で急減速)
    sudden_decel_jerk_threshold: 0.6 # m/s^3 (jerk <= -本値 で急減速。減速方向のみ)
    sudden_lateral_accel_threshold: 0.8 # m/s^2 (lateral_acceleration_abs >= 本値)
    announce:
      emergency: true
      restart_engage: true
      door_close: true
      door_open: true
      engage: true
      thank_you: true
      in_emergency: true
      going_to_depart: true
      going_to_arrive: true
      standing_depart: true
      standing_sudden: true
